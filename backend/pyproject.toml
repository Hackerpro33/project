[tool.poetry]
name = "insight-backend"
version = "0.1.0"
description = "Backend services for the Insight Sphere application."
authors = ["Insight Contributors <engineering@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "*"
uvicorn = { version = "*", extras = ["standard"] }
pandas = "*"
numpy = "*"
openpyxl = "*"
pdfplumber = "*"
pytesseract = "*"
Pillow = "*"
python-multipart = "*"
python-magic = "*"
puremagic = "*"
prometheus-client = "*"
pydantic-settings = "*"
redis = "*"
rq = "*"
pyyaml = "*"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
psycopg = { version = ">=3.1", extras = ["binary"] }
croniter = "*"
httpx = "*"
polyfactory = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
ruff = "*"
mypy = "*"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
