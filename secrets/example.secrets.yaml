# Example SOPS manifest. Encrypt copies of this file with `sops -e` before committing secrets.
# The `env` section is loaded by the application at runtime.
env:
  FRONTEND_ORIGIN: "https://analytics.example.com"
  ADDITIONAL_CORS_ORIGINS: "https://admin.example.com"
  ALLOWED_HOSTS: "analytics.example.com,admin.example.com"
  REDIS_URL: "redis://redis:6379/0"
  MAX_UPLOAD_SIZE_MB: 25
  ALLOWED_UPLOAD_EXTENSIONS: ".csv,.tsv,.xlsx,.xls"
  CLAMAV_SCAN_URL: "https://clamav.internal/scan"
  TASK_QUEUE_ENABLED: 1
  TASK_QUEUE_NAME: "insight-analytics"
  TASK_DEFAULT_TIMEOUT: 600
  UPLOAD_RATE_LIMIT_REQUESTS: 120
  UPLOAD_RATE_LIMIT_WINDOW_SECONDS: 60
  IDEMPOTENCY_CACHE_TTL_SECONDS: 900
  IDEMPOTENCY_CACHE_MAX_ENTRIES: 1024

rotation:
  cadence: "quarterly"
  emergency_playbook: "docs/runbooks/secret-rotation.md"
  contacts:
    - "security-team@example.com"
    - "platform@example.com"
  history:
    - { date: "2024-12-01", author: "security-team", notes: "Initial rollout" }

metadata:
  description: "Template for Insight Sphere runtime secrets managed via SOPS"
  gitops: "FluxCD"
  compliance: "ISO/IEC 27001"

sops:
  shamir_threshold: 2
  encrypted_regex: '^(env\..*)$'
  key_groups:
    - age:
        - "age1examplepublickeyforci..."
        - "age1examplepublickeyforops..."
  creation_rules:
    - path_regex: secrets/.*\.yaml
      encrypted_regex: '^(env\..*)$'
      age: ["age1examplepublickeyforci..."]
