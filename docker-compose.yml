version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: insight
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  unleash:
    image: unleashorg/unleash-server:4.22
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: insight
      DATABASE_USERNAME: insight
      DATABASE_PASSWORD: insight
      DATABASE_SSL: "false"
      INIT_FRONTEND_API_TOKENS: "default:development.unleash-insecure-api-token"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token"
      LOG_LEVEL: info
    depends_on:
      - db
    ports:
      - "4242:4242"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://insight:insight@db:5432/insight
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_ENABLED: "0"
      UNLEASH_API_URL: http://unleash:4242/api
      UNLEASH_API_TOKEN: development.unleash-insecure-api-token
      UNLEASH_ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/app/uploads:/app/app/uploads

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://backend:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres-data:
