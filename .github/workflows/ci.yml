name: CI

on:
  push:
    branches: ["main", "master", "work"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/app/requirements.txt
          pip install black==24.10.0 ruff==0.8.1 mypy==1.14.1 coverage[toml]==7.6.10
      - name: Run linters and type checks
        run: |
          black --check backend/app
          ruff check backend/app
          mypy backend/app
      - name: Run tests with coverage
        run: |
          pytest --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.python-version }}
          path: coverage.xml

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Run unit tests with coverage
        run: npm test --prefix frontend -- --coverage
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.node-version }}
          path: frontend/coverage

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          version: v8.18.2
          args: detect --source . --redact
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3
        with:
          scan: git
          extra_args: >-
            --no-update
            --fail
            --json
  coverage-badge:
    name: Publish coverage badge
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          path: coverage-artifacts/backend
          merge-multiple: true
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-coverage-*
          path: coverage-artifacts/frontend
          merge-multiple: true
      - name: Build badge assets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/build_coverage_badge.py
      - name: Publish badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: coverage
          keep_files: true
      - name: Commit README badge link
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: sync coverage badge URL"
          file_pattern: README.md
