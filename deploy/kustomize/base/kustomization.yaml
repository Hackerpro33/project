apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: insight-sphere
resources:
  - backend.yaml
  - frontend.yaml
  - redis.yaml
  - postgres.yaml
  - unleash.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: backend-env
    literals:
      - DATABASE_URL=postgresql+psycopg://insight:insight@postgres:5432/insight
      - REDIS_URL=redis://redis:6379/0
      - UNLEASH_API_URL=http://unleash:4242/api
      - UNLEASH_ENVIRONMENT=development
  - name: frontend-env
    literals:
      - VITE_API_BASE=http://backend:8000
secretGenerator:
  - name: unleash-token
    literals:
      - apiToken=development.unleash-insecure-api-token
  - name: postgres
    literals:
      - password=insight
