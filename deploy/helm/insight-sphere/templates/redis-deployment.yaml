{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-sphere.redisFullname" . }}
  labels:
    app: {{ include "insight-sphere.redisFullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "insight-sphere.redisFullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "insight-sphere.redisFullname" . }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-sphere.redisFullname" . }}
  labels:
    app: {{ include "insight-sphere.redisFullname" . }}
spec:
  selector:
    app: {{ include "insight-sphere.redisFullname" . }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
{{- end }}
