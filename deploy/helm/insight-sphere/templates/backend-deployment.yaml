apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-sphere.backendFullname" . }}
  labels:
    app: {{ include "insight-sphere.backendFullname" . }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "insight-sphere.backendFullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "insight-sphere.backendFullname" . }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          env:
            {{- range .Values.backend.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom: {{ toYaml .valueFrom | nindent 14 }}
              {{- end }}
            {{- end }}
          resources: {{ toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe: {{ toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.backend.readinessProbe | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-sphere.backendFullname" . }}
  labels:
    app: {{ include "insight-sphere.backendFullname" . }}
spec:
  selector:
    app: {{ include "insight-sphere.backendFullname" . }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
  type: {{ .Values.backend.service.type }}
